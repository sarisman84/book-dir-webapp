<div class="pagination-container" role="navigation" aria-label="Pagination navigation">
  <div class="desktop-pagination" role="group" aria-label="Page navigation">
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === 1" 
      (click)="onPageChange(currentPage - 1)"
      aria-label="Previous page">
      &lsaquo;
    </button>

    <div class="pages" role="list">
      <button 
        *ngFor="let page of pages" 
        class="page-number" 
        [class.active]="page === currentPage" 
        (click)="onPageChange(page)"
        [attr.aria-current]="page === currentPage ? 'page' : null"
        [attr.role]="page === currentPage ? 'listitem' : null">
        {{ page }}
      </button>
    </div>

    <button 
      class="btn-pagination" 
      [disabled]="currentPage === totalPages" 
      (click)="onPageChange(currentPage + 1)"
      aria-label="Next page">
      &rsaquo;
    </button>
  </div>

  <div class="mobile-pagination" role="group" aria-label="Mobile page navigation">
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === 1" 
      (click)="onPageChange(currentPage - 1)"
      aria-label="Previous page">
      &lsaquo;
    </button>
    <span class="page-indicator" aria-live="polite" aria-atomic="true">Page {{ currentPage }} of {{ totalPages }}</span>
    <button 
      class="btn-pagination" 
      [disabled]="currentPage === totalPages" 
      (click)="onPageChange(currentPage + 1)"
      aria-label="Next page">
      &rsaquo;
    </button>
  </div>
</div>
