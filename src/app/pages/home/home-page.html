<header class="page-header">
  <div class="header-title-group">
    <h1 class="page-title">Books</h1>
    <span class="page-subtitle">Shared library catalog and scholarly collection</span>
  </div>
  <button class="btn-primary" aria-label="Add a new book to the catalog">+ Add Book</button>
</header>
<section class="app-grid" aria-label="Book catalog">
  @for (book of paginatedBooks; track book.id) {
    <app-card
      variant="standard"
      [title]="book.title"
      [author]="book.author"
      [coverImageUrl]="book.coverImageUrl"
      [status]="book.status"
    ></app-card>
  }
</section>
<section class="featured-quote-section" aria-label="Featured quote">
  <header class="section-header">
    <h2 class="section-title">Featured Personal Quote Snippet</h2>
  </header>
  <app-featured-quote [quote]="sampleQuote" [pageNumber]="42"></app-featured-quote>
</section>
<app-pagination [totalPages]="totalPages" [currentPage]="currentPage" (pageChange)="handlePageChange($event)"></app-pagination>
